<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: monospace;
}

/* MATRIX */

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* HEART */

.scene {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 900px;
}

.heart {
    position: relative;
    width: 300px;
    height: 300px;

    transform-style: preserve-3d;

    animation: rotateHeart 8s linear infinite;

    filter:
        drop-shadow(0 0 8px #ff6500)
        drop-shadow(0 0 25px #ff4500)
        drop-shadow(0 0 50px #ff2200);
}

/*
   Membentuk jaringan hati
*/

.line {
    position: absolute;

    width: 100%;
    height: 100%;

    border: 1px solid #ff7900;

    border-radius: 50%;

    transform-style: preserve-3d;
}

/* Lapisan depan-belakang */

.line:nth-child(1) {
    transform: rotateY(0deg) scaleX(1);
}

.line:nth-child(2) {
    transform: rotateY(20deg) scaleX(.94);
}

.line:nth-child(3) {
    transform: rotateY(40deg) scaleX(.78);
}

.line:nth-child(4) {
    transform: rotateY(60deg) scaleX(.62);
}

.line:nth-child(5) {
    transform: rotateY(80deg) scaleX(.45);
}

.line:nth-child(6) {
    transform: rotateY(100deg) scaleX(.30);
}

.line:nth-child(7) {
    transform: rotateY(120deg) scaleX(.18);
}

.line:nth-child(8) {
    transform: rotateY(140deg) scaleX(.08);
}

/*
   Potongan bagian atas
   supaya terlihat seperti LOVE
*/

.heart::before,
.heart::after {
    content: "";
    position: absolute;

    width: 150px;
    height: 230px;

    border: 1px solid #ff7900;

    border-radius: 80px 80px 0 0;

    top: 35px;

    filter:
        drop-shadow(0 0 8px #ff6500);
}

.heart::before {
    left: 25px;
    transform: rotate(-45deg);
    transform-origin: 100% 100%;
}

.heart::after {
    right: 25px;
    transform: rotate(45deg);
    transform-origin: 0 100%;
}

/* ROTASI 3D */

@keyframes rotateHeart {

    0% {
        transform:
            rotateX(8deg)
            rotateY(0deg)
            rotateZ(0deg);
    }

    50% {
        transform:
            rotateX(-8deg)
            rotateY(180deg)
            rotateZ(0deg);
    }

    100% {
        transform:
            rotateX(8deg)
            rotateY(360deg)
            rotateZ(0deg);
    }
}

/* TEKS */

.text {
    position: fixed;

    bottom: 55px;

    width: 100%;

    text-align: center;

    color: #ff7900;

    letter-spacing: 5px;

    font-size: 14px;

    text-shadow:
        0 0 10px #ff6500,
        0 0 25px #ff4500;

    animation: textGlow 2s infinite alternate;
}

@keyframes textGlow {

    from {
        opacity: .5;
    }

    to {
        opacity: 1;
    }
}

/* MOBILE */

@media (max-width: 600px) {

    .heart {
        width: 240px;
        height: 240px;
    }

    .text {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- MATRIX BACKGROUND -->

<canvas id="matrix"></canvas>


<!-- 3D WIRE HEART -->

<div class="scene">

    <div class="heart">

        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>

    </div>

</div>


<div class="text">
    MADE WITH LOVE
</div>


<script>

/* =========================
   MATRIX EFFECT
========================= */

const canvas =
    document.getElementById("matrix");

const ctx =
    canvas.getContext("2d");

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


const letters =
    "01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const fontSize = 14;

let columns =
    Math.floor(
        canvas.width / fontSize
    );

let drops =
    Array(columns).fill(1);


function drawMatrix() {

    ctx.fillStyle =
        "rgba(0, 0, 0, 0.08)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "#ff6500";

    ctx.font =
        fontSize + "px monospace";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {

        const text =
            letters[
                Math.floor(
                    Math.random() *
                    letters.length
                )
            ];

        ctx.fillText(
            text,
            i * fontSize,
            drops[i] * fontSize
        );


        if (
            drops[i] * fontSize >
            canvas.height &&
            Math.random() > 0.975
        ) {

            drops[i] = 0;

        }

        drops[i]++;
    }
}

setInterval(
    drawMatrix,
    35
);

</script>

</body>
</html>
